backend:
  name: github
  repo: pdkiller666/natalia-site
  branch: main
  base_url: https://netlify-cms-github-oauth-provider-vert.vercel.app

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "content"
    label: "Контент сайта"
    description: "Изменяйте поля и нажимайте Publish — сайт обновится сам."
    files:
      - name: "site"
        label: "Весь контент"
        file: "content/site.json"
        fields:
          - name: "meta"
            label: "Мета-данные сайта"
            widget: "object"
            fields:
              - {name: title, label: "Заголовок страницы (title)", widget: string}
              - {name: description, label: "Описание (description)", widget: text}
              - {name: ogImage, label: "OG-изображение (для соцсетей)", widget: image}
          - name: "colors"
            label: "Цвета сайта"
            widget: "object"
            fields:
              - {name: bg, label: "Основной фон", widget: color}
              - {name: bg2, label: "Фон карточек и секций", widget: color}
              - {name: ink, label: "Основной текст", widget: color}
              - {name: muted, label: "Вторичный текст", widget: color}
              - {name: faint, label: "Приглушённый текст (подписи)", widget: color}
              - {name: accent, label: "Акцент (кнопки, заголовки, рамки)", widget: color}
              - {name: gold, label: "Золото (звёздочки, детали)", widget: color}
              - {name: cream, label: "Фон светлой секции", widget: color}
              - {name: creamInk, label: "Текст на светлой секции", widget: color}
              - {name: creamRose, label: "Акцент на светлой секции", widget: color}
          - name: "hero"
            label: "Главный экран"
            widget: "object"
            fields:
              - {name: title, label: "Заголовок", widget: text}
              - {name: lead, label: "Подзаголовок", widget: text}
              - {name: ctaButton, label: "Текст главной кнопки", widget: string}
              - {name: videoButton, label: "Текст кнопки видео", widget: string}
              - {name: availability, label: "Строка про сезон", widget: string}
          - name: "sections"
            label: "Секции сайта"
            widget: "object"
            fields:
              - name: "about"
                label: "Обо мне"
                widget: "object"
                fields:
                  - {name: number, label: "Номер секции", widget: string}
                  - {name: title, label: "Название секции", widget: string}
                  - {name: heading, label: "Заголовок", widget: text}
                  - {name: text, label: "Основной текст", widget: text}
                  - {name: quote, label: "Цитата", widget: text}
                  - {name: signature, label: "Подпись", widget: string}
                  - {name: years, label: "Лет на сцене (бейдж)", widget: number}
                  - name: "stats"
                    label: "Цифры"
                    widget: list
                    fields:
                      - {name: value, label: "Число", widget: number}
                      - {name: suffix, label: "Суффикс (например +)", widget: string, required: false}
                      - {name: label, label: "Подпись", widget: string}
              - name: "video"
                label: "Видео"
                widget: "object"
                fields:
                  - {name: number, label: "Номер секции", widget: string}
                  - {name: title, label: "Название секции", widget: string}
                  - {name: heading, label: "Заголовок", widget: text}
                  - {name: description, label: "Описание", widget: string}
                  - {name: subdescription, label: "Под-описание", widget: string}
                  - {name: videoUrl, label: "Ссылка на видео (YouTube, VK, RuTube, Vimeo и др.)", widget: string}
              - name: "formats"
                label: "Форматы событий"
                widget: "object"
                fields:
                  - {name: number, label: "Номер секции", widget: string}
                  - {name: title, label: "Название секции", widget: string}
                  - {name: heading, label: "Заголовок", widget: text}
                  - {name: description, label: "Описание", widget: text}
                  - name: "items"
                    label: "Форматы"
                    widget: list
                    summary: "{{fields.name}}"
                    fields:
                      - {name: number, label: "Номер", widget: string}
                      - {name: name, label: "Название", widget: string}
                      - {name: description, label: "Описание", widget: text}
                      - name: "tags"
                        label: "Теги"
                        widget: list
                        field: {name: tag, label: "Тег", widget: string}
              - name: "cases"
                label: "Кейсы"
                widget: "object"
                fields:
                  - {name: number, label: "Номер секции", widget: string}
                  - {name: title, label: "Название секции", widget: string}
                  - {name: heading, label: "Заголовок", widget: text}
              - name: "prices"
                label: "Пакеты и цены"
                widget: "object"
                fields:
                  - {name: number, label: "Номер секции", widget: string}
                  - {name: title, label: "Название секции", widget: string}
                  - {name: heading, label: "Заголовок", widget: text}
                  - {name: note, label: "Примечание под ценами", widget: text}
                  - {name: teamTitle, label: "Заголовок блока команды", widget: string}
              - name: "process"
                label: "Как рождается событие"
                widget: "object"
                fields:
                  - {name: number, label: "Номер секции", widget: string}
                  - {name: title, label: "Название секции", widget: string}
                  - {name: heading, label: "Заголовок", widget: text}
                  - {name: description, label: "Описание", widget: text}
                  - {name: ctaButton, label: "Текст кнопки", widget: string}
                  - name: "steps"
                    label: "Шаги"
                    widget: list
                    summary: "{{fields.title}}"
                    fields:
                      - {name: number, label: "Номер", widget: string}
                      - {name: title, label: "Заголовок", widget: string}
                      - {name: text, label: "Текст", widget: text}
                  - name: "antiList"
                    label: "Чего не бывает"
                    widget: "object"
                    fields:
                      - {name: title, label: "Заголовок", widget: string}
                      - name: "items"
                        label: "Пункты"
                        widget: list
                        field: {name: item, label: "Пункт", widget: string}
              - name: "rituals"
                label: "Фирменные ритуалы"
                widget: "object"
                fields:
                  - {name: number, label: "Номер секции", widget: string}
                  - {name: title, label: "Название секции", widget: string}
                  - {name: heading, label: "Заголовок", widget: text}
                  - {name: scrollHint, label: "Подсказка скролла", widget: string}
              - name: "gallery"
                label: "Галерея"
                widget: "object"
                fields:
                  - {name: number, label: "Номер секции", widget: string}
                  - {name: title, label: "Название секции", widget: string}
                  - {name: heading, label: "Заголовок", widget: text}
              - name: "reviews"
                label: "Отзывы"
                widget: "object"
                fields:
                  - {name: number, label: "Номер секции", widget: string}
                  - {name: title, label: "Название секции", widget: string}
                  - {name: heading, label: "Заголовок", widget: text}
              - name: "faq"
                label: "Вопросы"
                widget: "object"
                fields:
                  - {name: number, label: "Номер секции", widget: string}
                  - {name: title, label: "Название секции", widget: string}
                  - {name: heading, label: "Заголовок", widget: text}
                  - {name: description, label: "Описание", widget: text}
              - name: "booking"
                label: "Свободные даты"
                widget: "object"
                fields:
                  - {name: number, label: "Номер секции", widget: string}
                  - {name: title, label: "Название секции", widget: string}
                  - {name: heading, label: "Заголовок", widget: text}
                  - {name: description, label: "Описание", widget: text}
                  - {name: guarantee, label: "Текст гарантии", widget: text}
          - name: "photos"
            label: "Фотографии"
            widget: "object"
            fields:
              - {name: hero, label: "Портрет на главном (вертикальное 4:5)", widget: image, required: false}
              - {name: about, label: "Фото «Обо мне» (вертикальное 4:5)", widget: image, required: false}
              - {name: showreel, label: "Постер шоурила (16:9)", widget: image, required: false}
              - {name: format1, label: "Формат «Свадьбы» (горизонтальное)", widget: image, required: false}
              - {name: format2, label: "Формат «Корпоративы» (горизонтальное)", widget: image, required: false}
              - {name: format3, label: "Формат «Юбилеи» (горизонтальное)", widget: image, required: false}
              - {name: format4, label: "Формат «Частные вечера» (горизонтальное)", widget: image, required: false}
          - name: "gallery"
            label: "Галерея «Моменты»"
            widget: list
            summary: "{{fields.caption}}"
            fields:
              - {name: photo, label: "Фото (вертикальное 4:5)", widget: image, required: false}
              - {name: caption, label: "Подпись", widget: string}
              - {name: event, label: "Событие (показывается в просмотрщике)", widget: string, required: false}
              - name: category
                label: "Категория"
                widget: select
                required: false
                options:
                  - {value: wedding, label: "Свадьбы"}
                  - {value: corporate, label: "Корпоративы"}
                  - {value: jubilee, label: "Юбилеи и семейные"}
                  - {value: private, label: "Частные вечера и презентации"}
                  - {value: other, label: "Другое"}
          - name: "socials"
            label: "Кнопки соцсетей"
            widget: list
            summary: "{{fields.label}}"
            fields:
              - {name: label, label: "Текст кнопки", widget: string}
              - {name: url, label: "Ссылка", widget: string}
          - name: "contacts"
            label: "Контакты"
            widget: "object"
            fields:
              - {name: phone, label: "Телефон (как показывать)", widget: string}
              - {name: phoneHref, label: "Телефон для ссылки (+7…)", widget: string}
              - {name: email, label: Email, widget: string}
              - {name: telegram, label: "Ссылка Telegram", widget: string}
              - {name: whatsapp, label: "Ссылка WhatsApp", widget: string}
              - {name: vk, label: "Ссылка VK", widget: string, required: false}
              - {name: instagram, label: "Ссылка Instagram", widget: string, required: false}
              - {name: geography, label: "География", widget: string}
          - name: "team"
            label: "Команда"
            widget: list
            summary: "{{fields.name}}"
            fields:
              - {name: photo, label: "Фото", widget: image, required: false}
              - {name: name, label: "Имя и роль", widget: string}
              - {name: role, label: "Описание", widget: string}
          - name: "cases"
            label: "Кейсы (данные)"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - {name: title, label: "Заголовок", widget: string}
              - {name: task, label: "Задача", widget: text}
              - {name: solution, label: "Решение", widget: text}
              - {name: result, label: "Результат крупно", widget: string}
              - {name: result_note, label: "Подпись под результатом", widget: string}
              - {name: meta, label: "Мета", widget: string}
              - {name: photo, label: "Фоновое фото блока", widget: image, required: false}
              - name: gallery
                label: "Галерея кейса (открывается кнопкой)"
                widget: list
                required: false
                fields:
                  - {name: photo, label: "Фото", widget: image, required: false}
                  - {name: caption, label: "Подпись", widget: string, required: false}
          - name: "rituals"
            label: "Фирменные ритуалы (данные)"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - {name: title, label: "Название", widget: string}
              - {name: text, label: "Описание", widget: text}
          - name: "reviews"
            label: "Отзывы (данные)"
            widget: list
            summary: "{{fields.author}}"
            fields:
              - {name: avatar, label: "Аватар", widget: image, required: false}
              - {name: text, label: "Текст отзыва", widget: text}
              - {name: author, label: "Автор", widget: string}
              - {name: event, label: "Событие", widget: string}
              - {name: source, label: "Источник", widget: string}
          - name: "logos"
            label: "Площадки"
            widget: list
            field: {name: name, label: "Название", widget: string}
          - name: "faq"
            label: "Вопросы и ответы"
            widget: list
            summary: "{{fields.q}}"
            fields:
              - {name: q, label: "Вопрос", widget: string}
              - {name: a, label: "Ответ", widget: text}
          - name: "footer"
            label: "Футер"
            widget: "object"
            fields:
              - {name: brand, label: "Название бренда", widget: string}
              - {name: subtitle, label: "Подпись", widget: string}
              - {name: copyright, label: "Копирайт", widget: string}
              - {name: disclaimer, label: "Дисклеймер", widget: text}
